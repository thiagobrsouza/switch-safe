{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Configuração inicial{% endblock %}
{% block auth %}
<div class="app-alert app-alert--info"><span class="ar-icon">info</span><span>Primeiro acesso: crie o usuário administrador.</span></div>
<form method="post" class="app-stack">
  {{ m.csrf() }}
  <div class="ar-field">
    <label class="ar-field__label" for="username">Usuário<span class="ar-req">*</span></label>
    <input class="ar-input" type="text" id="username" name="username" value="admin" autocomplete="username" required minlength="3" maxlength="64">
  </div>
  <div class="ar-field">
    <label class="ar-field__label" for="password">Senha<span class="ar-req">*</span></label>
    <input class="ar-input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    {{ m.help('Mínimo de 8 caracteres.') }}
  </div>
  <div class="ar-field">
    <label class="ar-field__label" for="confirm">Confirmar senha<span class="ar-req">*</span></label>
    <input class="ar-input" type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8">
  </div>
  <button type="submit" class="ar-btn ar-btn--primary ar-btn--block">Criar administrador</button>
</form>
{% endblock %}
