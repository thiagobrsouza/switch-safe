{% if not ftp.writable %}
  <div class="app-alert app-alert--error"><span class="ar-icon">error</span>
    <span>Sem permissão de escrita em <code>{{ ftp.root }}</code>, então os firewalls não conseguirão enviar backups.
    No servidor, ajuste o dono da pasta para o UID {{ ftp.uid }}:
    <code>sudo chown -R {{ ftp.uid }}:{{ ftp.uid }} &lt;pasta do FIREWALL_BACKUP_PATH&gt;</code></span>
  </div>
{% endif %}
