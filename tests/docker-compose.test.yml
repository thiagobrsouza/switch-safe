# Ambiente isolado para o teste ponta a ponta (não toca nos dados reais).
# Uso: bash tests/run_e2e.sh
name: switch-safe-test

services:
  app:
    build: ..
    image: switch-safe:latest
    environment:
      TZ: America/Sao_Paulo
      APP_PORT: "8080"
      FTP_PUBLIC_HOST: 127.0.0.1
      FTP_PORT: "2121"
      FIREWALL_CHECK_SECONDS: "3"
    volumes:
      - testdata:/data
      - fwdata:/data/firewalls  # como em produção: volume separado para os firewalls

  fake-switch:
    image: switch-safe:latest
    user: "0"
    entrypoint: ["python", "/tests/fake_switch.py"]
    healthcheck:
      disable: true
    environment:
      FAKE_EXTRA_FILE: /scratch/extra.txt
    volumes:
      - ./:/tests:ro
      - scratch:/scratch

  tester:
    image: switch-safe:latest
    user: "0"
    entrypoint: ["python", "/tests/e2e.py"]
    healthcheck:
      disable: true
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
      fake-switch:
        condition: service_started
    environment:
      FAKE_EXTRA_FILE: /scratch/extra.txt
      FAKE_HOST: fake-switch
    volumes:
      - ./:/tests:ro
      - testdata:/data
      - fwdata:/data/firewalls  # como em produção: volume separado para os firewalls
      - scratch:/scratch

volumes:
  testdata:
  fwdata:
  scratch:
